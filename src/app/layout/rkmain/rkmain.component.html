<div class="rkmain-container">
  <!-- Header -->
  <app-header
    [breadcrumbs]="breadcrumbs()"
    [usuario]="usuario()"
    [distrito]="distrito()"
    [posicion]="posicion()"
    [notificationCount]="notificationCount()"
    (toggleMenu)="toggleSidenav()"
    (navigateHome)="goToDashboard()"
    (notificationsClick)="showNotifications()"
    (legendClick)="showLegend()"
    (helpClick)="showHelp()"
    (logoutClick)="logout()">
  </app-header>

  <!-- Sidenav container -->
  <mat-sidenav-container
    class="sidenav-container"
    [hasBackdrop]="isMobile()">
    <!-- Sidenav (Árbol) - Modo dinámico side/over -->
    <mat-sidenav
      #sidenav
      [mode]="sidenavMode()"
      [opened]="sidenavOpened()"
      class="tree-sidenav">
      <app-tree-sidebar></app-tree-sidebar>
    </mat-sidenav>

    <!-- Contenido principal -->
    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
